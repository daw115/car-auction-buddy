# Usługa uruchamia kod z bieżącego release (/opt, tylko do czytania), a dane
# czyta z WorkingDirectory w katalogu domowym — każda ścieżka danych w backendzie
# to "./data/...", liczone od cwd.
#
# Tu NIE WOLNO wpisać konkretnego release'u. Kopia z 10 sierpnia miała w tym
# miejscu zaszyte /opt/usacar/releases/ebf176d-caf6b6e596ec, a usacar-deploy-api.sh
# przestawia symlink "current" i restartuje usługę — więc każde wdrożenie
# backendu restartowało proces chodzący dalej na starym kodzie.
[Service]
ExecStart=
ExecStart=/home/dawid/usacar/usa-car-finder/venv/bin/uvicorn --app-dir /opt/usacar/current/usa-car-finder api.main:app --host 127.0.0.1 --port 8000
